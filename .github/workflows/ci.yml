name: Read-only prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python CSV contract and offline static security tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript and local auth/refresh security tests
        run: node --test tests/*.test.cjs tests/server.test.mjs mesh-reference/*.test.mjs
      - name: Syntax check local app and ciphertext-backup CLI
        run: |
          node --check web/app.js
          node --check server/app.mjs
          node --check server/vault.mjs
          node --check server/plaid.mjs
          node --check server/paid-guard.mjs
          node --check cli/vault-backup.mjs
