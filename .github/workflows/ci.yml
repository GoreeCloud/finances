name: Read-only prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python unit and static-boundary tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript unit and Mesh-denial tests
        run: node --test tests/*.test.cjs mesh-reference/*.test.mjs
